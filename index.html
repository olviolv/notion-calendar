<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month</title>
<style>
  :root {
    --bg: #fbf6f7;
    --ink: #4a3b42;
    --muted: #b9a3ab;
    --faint: #dccdd2;
    --line: #eadfe3;
    --accent: #b8788a;
    --accent-soft: #f3e6ea;
    --today-ink: #fff8f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a2226; --ink: #f0e4e8; --muted: #8a7680; --faint: #4d3f46;
      --line: #3c3137; --accent: #c98a9c; --accent-soft: #3a2c32; --today-ink: #2a2226;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    padding: 6px;
  }
  .cal {
    width: 100%;
    background: var(--bg);
    border-radius: 18px;
    padding: clamp(12px, 4vw, 22px);
  }
  .head {
    display: flex; align-items: baseline; gap: .4em;
    margin: 0 0 clamp(8px, 2.5vw, 14px) 2px;
  }
  .head .month { color: var(--accent); font-weight: 700; font-size: clamp(15px, 4.6vw, 20px); letter-spacing: .01em; }
  .head .year  { color: var(--muted);  font-weight: 500; font-size: clamp(13px, 3.8vw, 16px); }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
  }
  .dow {
    font-size: clamp(10px, 2.8vw, 12px); font-weight: 600;
    color: var(--muted);
    padding-bottom: clamp(6px, 1.8vw, 10px);
    border-bottom: 1px solid var(--line);
  }
  .day {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--line);
    font-size: clamp(12px, 3.6vw, 16px); font-weight: 500;
  }
  .day:nth-last-child(-n+7) { border-bottom: 0; }
  .weekend { color: var(--muted); }
  .other { color: var(--faint); font-weight: 400; }
  .today span {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.9em; height: 1.9em; border-radius: 50%;
    background: var(--accent); color: var(--today-ink); font-weight: 700;
  }
</style>
</head>
<body>
  <div class="cal" role="group" aria-label="Month calendar">
    <div class="head"><span class="month" id="month"></span><span class="year" id="year"></span></div>
    <div class="grid" id="grid"></div>
  </div>
<script>
  const WEEK_START = 0;               // 0 = Sunday-first, 1 = Monday-first
  const WEEKEND = new Set([5, 6]);    // Fri, Sat
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), t = now.getDate();
  const first = new Date(y, m, 1);
  const days = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();

  document.getElementById("month").textContent = first.toLocaleString("en-US", { month: "long" });
  document.getElementById("year").textContent = y;

  const grid = document.getElementById("grid");
  const add = (cls, html) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; grid.appendChild(d); };

  for (let i = 0; i < 7; i++) add("dow", DOW[(WEEK_START + i) % 7]);

  const lead = (first.getDay() - WEEK_START + 7) % 7;
  const cells = [];
  for (let i = lead; i > 0; i--) cells.push({ n: prevDays - i + 1, other: true, dow: (WEEK_START + lead - i) % 7 });
  for (let d = 1; d <= days; d++) cells.push({ n: d, dow: new Date(y, m, d).getDay(), today: d === t });
  let next = 1;
  while (cells.length % 7) cells.push({ n: next++, other: true, dow: (cells[cells.length - 1].dow + 1) % 7 });

  for (const c of cells) {
    let cls = "day";
    if (c.other) cls += " other";
    else if (WEEKEND.has(c.dow)) cls += " weekend";
    if (c.today) cls += " today";
    add(cls, c.today ? `<span>${c.n}</span>` : c.n);
  }
</script>
</body>
</html>
