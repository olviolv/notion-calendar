<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month</title>
<style>
  :root {
    --bg: #fbf6f7;
    --ink: #4a3b42;
    --muted: #b9a3ab;
    --faint: #dccdd2;
    --line: #eadfe3;
    --accent: #b8788a;
    --accent-soft: #f3e6ea;
    --today-ink: #fff8f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a2226; --ink: #f0e4e8; --muted: #8a7680; --faint: #4d3f46;
      --line: #3c3137; --accent: #c98a9c; --accent-soft: #3a2c32; --today-ink: #2a2226;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    padding: 6px;
  }
  .cal { width: 100%; background: var(--bg); border-radius: 18px; padding: clamp(12px, 4vw, 22px); }
  .head { display: flex; align-items: baseline; gap: .4em; margin: 0 0 clamp(8px, 2.5vw, 14px) 2px; }
  .nav { margin-left: auto; display: flex; gap: 2px; align-self: center; }
  .nav button {
    all: unset; cursor: pointer; width: 1.7em; height: 1.7em; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: clamp(13px, 3.8vw, 16px);
  }
  .nav button:hover { background: var(--accent-soft); color: var(--accent); }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nav svg { width: .6em; height: .6em; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .today-btn { cursor: pointer; }
  .head .month { color: var(--accent); font-weight: 700; font-size: clamp(15px, 4.6vw, 20px); letter-spacing: .01em; }
  .head .year  { color: var(--muted);  font-weight: 500; font-size: clamp(13px, 3.8vw, 16px); }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .dow {
    font-size: clamp(10px, 2.8vw, 12px); font-weight: 600; color: var(--muted);
    padding-bottom: clamp(6px, 1.8vw, 10px); border-bottom: 1px solid var(--line);
  }
  .day {
    aspect-ratio: 1 / 1.2;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: clamp(5px, 1.6vw, 9px);
    border-bottom: 1px solid var(--line);
    font-size: clamp(12px, 3.6vw, 16px); font-weight: 500;
  }
  .day:nth-last-child(-n+7) { border-bottom: 0; }
  .weekend { color: var(--muted); }
  .other { color: var(--faint); font-weight: 400; }
  .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.9em; height: 1.9em; border-radius: 50%;
  }
  .today .num { background: var(--accent); color: var(--today-ink); font-weight: 700; }
  .tag {
    margin-top: 2px; padding: 0 2px;
    font-size: clamp(7px, 2.1vw, 10px); font-weight: 600; line-height: 1.15;
    color: var(--accent);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .tag.minor { color: var(--muted); font-weight: 500; }
  .other .tag { color: var(--faint); }
</style>
</head>
<body>
  <div class="cal" role="group" aria-label="Month calendar">
    <div class="head">
      <span class="month today-btn" id="month" title="Back to today"></span><span class="year" id="year"></span>
      <div class="nav">
        <button id="prev" aria-label="Previous month"><svg viewBox="0 0 10 10"><path d="M6.5 1.5 3 5l3.5 3.5"/></svg></button>
        <button id="next" aria-label="Next month"><svg viewBox="0 0 10 10"><path d="M3.5 1.5 7 5l-3.5 3.5"/></svg></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
<script>
const leap = y => ((7 * y + 1) % 19) < 7;
function elapsed(y) {
  const me = 235 * Math.floor((y - 1) / 19) + 12 * ((y - 1) % 19) + Math.floor((7 * ((y - 1) % 19) + 1) / 19);
  const pe = 204 + 793 * (me % 1080);
  const he = 5 + 12 * me + 793 * Math.floor(me / 1080) + Math.floor(pe / 1080);
  let day = 1 + 29 * me + Math.floor(he / 24);
  const parts = 1080 * (he % 24) + pe % 1080;
  if (parts >= 19440 || (day % 7 === 2 && parts >= 9924 && !leap(y)) || (day % 7 === 1 && parts >= 16789 && leap(y - 1))) day++;
  if ([0, 3, 5].includes(day % 7)) day++;
  return day;
}
const newYear = y => elapsed(y) - 1373429 + 1;               // absolute day of 1 Tishrei
const yearLen = y => elapsed(y + 1) - elapsed(y);
function monthLens(y) {                                       // Tishrei-first
  const L = yearLen(y);
  const m = [30, L % 10 === 5 ? 30 : 29, L % 10 === 3 ? 29 : 30, 29, 30];
  if (leap(y)) m.push(30);
  return m.concat([29, 30, 29, 30, 29, 30, 29]);
}
const NAMES_COMMON = ["Tishrei","Cheshvan","Kislev","Tevet","Shvat","Adar","Nisan","Iyar","Sivan","Tammuz","Av","Elul"];
const NAMES_LEAP   = ["Tishrei","Cheshvan","Kislev","Tevet","Shvat","Adar I","Adar II","Nisan","Iyar","Sivan","Tammuz","Av","Elul"];

const toAbs = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000) + 719163;
function hebrew(date) {
  const abs = toAbs(date);
  let y = date.getFullYear() + 3760;
  while (newYear(y + 1) <= abs) y++;
  while (newYear(y) > abs) y--;
  let rem = abs - newYear(y);
  const lens = monthLens(y), names = leap(y) ? NAMES_LEAP : NAMES_COMMON;
  let i = 0;
  while (rem >= lens[i]) { rem -= lens[i]; i++; }
  return { y, m: names[i], d: rem + 1, abs, dow: abs % 7 };     // dow: 0 = Sunday
}
// absolute day of a Hebrew (year, monthName, day)
function absOf(y, name, d) {
  const lens = monthLens(y), names = leap(y) ? NAMES_LEAP : NAMES_COMMON;
  const idx = names.indexOf(name);
  return newYear(y) + lens.slice(0, idx).reduce((a, b) => a + b, 0) + d - 1;
}

function holiday(date) {
  const h = hebrew(date), { y, m, d, abs } = h;
  const fixed = {
    "Elul 29": "Erev Rosh Hashana", "Tishrei 1": "Rosh Hashana", "Tishrei 2": "Rosh Hashana",
    "Tishrei 9": "Erev Yom Kippur", "Tishrei 10": "Yom Kippur",
    "Tishrei 14": "Erev Sukkot", "Tishrei 15": "Sukkot", "Tishrei 16": "Chol HaMoed", "Tishrei 17": "Chol HaMoed",
    "Tishrei 18": "Chol HaMoed", "Tishrei 19": "Chol HaMoed", "Tishrei 20": "Chol HaMoed",
    "Tishrei 21": "Hoshana Raba", "Tishrei 22": "Simchat Torah",
    "Shvat 15": "Tu BiShvat",
    "Nisan 14": "Erev Pesach", "Nisan 15": "Pesach", "Nisan 16": "Chol HaMoed", "Nisan 17": "Chol HaMoed",
    "Nisan 18": "Chol HaMoed", "Nisan 19": "Chol HaMoed", "Nisan 20": "Chol HaMoed", "Nisan 21": "7th of Pesach",
    "Iyar 18": "Lag BaOmer", "Iyar 28": "Yom Yerushalayim",
    "Sivan 5": "Erev Shavuot", "Sivan 6": "Shavuot",
  };
  const key = `${m} ${d}`;
  if (fixed[key]) return fixed[key];

  // Purim: Adar in common years, Adar II in leap years
  const purimMonth = leap(y) ? "Adar II" : "Adar";
  if (m === purimMonth && d === 14) return "Purim";
  if (m === purimMonth && d === 15) return "Shushan Purim";

  // Hanukkah: 8 days from 25 Kislev
  const hk = abs - absOf(y, "Kislev", 25);
  if (hk >= 0 && hk < 8) return `Hanukkah ${hk + 1}`;

  // Tisha B'Av: 9 Av, pushed to Sunday if it falls on Shabbat
  let tb = absOf(y, "Av", 9); if (tb % 7 === 6) tb++;
  if (abs === tb) return "Tisha B'Av";

  // Yom HaShoah: 27 Nisan; Fri → Thu, Sun → Mon
  let ys = absOf(y, "Nisan", 27); if (ys % 7 === 5) ys--; else if (ys % 7 === 0) ys++;
  if (abs === ys) return "Yom HaShoah";

  // Yom HaAtzmaut: 5 Iyar; Fri → Thu, Sat → Thu, Mon → Tue. Zikaron is the day before.
  let ya = absOf(y, "Iyar", 5);
  const w = ya % 7;
  if (w === 5) ya -= 1; else if (w === 6) ya -= 2; else if (w === 1) ya += 1;
  if (abs === ya) return "Yom HaAtzmaut";
  if (abs === ya - 1) return "Yom HaZikaron";

  return null;
}


  // ---------- render ----------
  const WEEK_START = 0;               // 0 = Sunday-first, 1 = Monday-first
  const WEEKEND = new Set([5, 6]);    // Fri, Sat
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MINOR = /Chol HaMoed|Hoshana|Shushan|Lag|Yerushalayim|Tu BiShvat/;

  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  const grid = document.getElementById("grid");
  const add = (cls, html) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; grid.appendChild(d); };

  function render() {
    const first = new Date(y, m, 1);
    const days = new Date(y, m + 1, 0).getDate();
    const isThisMonth = y === now.getFullYear() && m === now.getMonth();
    document.getElementById("month").textContent = first.toLocaleString("en-US", { month: "long" });
    document.getElementById("year").textContent = y;
    grid.innerHTML = "";

    for (let i = 0; i < 7; i++) add("dow", DOW[(WEEK_START + i) % 7]);

    const lead = (first.getDay() - WEEK_START + 7) % 7;
    const cells = [];
    for (let i = lead; i > 0; i--) cells.push({ date: new Date(y, m, 1 - i), other: true });
    for (let d = 1; d <= days; d++) cells.push({ date: new Date(y, m, d), today: isThisMonth && d === now.getDate() });
    let next = 1;
    while (cells.length % 7) cells.push({ date: new Date(y, m + 1, next++), other: true });

    for (const c of cells) {
      const dow = c.date.getDay();
      let cls = "day";
      if (c.other) cls += " other";
      else if (WEEKEND.has(dow)) cls += " weekend";
      if (c.today) cls += " today";
      const h = holiday(c.date);
      const tag = h ? `<span class="tag${MINOR.test(h) ? " minor" : ""}">${h}</span>` : "";
      add(cls, `<span class="num">${c.date.getDate()}</span>${tag}`);
    }
  }

  const shift = n => { m += n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } render(); };
  document.getElementById("prev").onclick = () => shift(-1);
  document.getElementById("next").onclick = () => shift(1);
  document.getElementById("month").onclick = () => { y = now.getFullYear(); m = now.getMonth(); render(); };
  render();
</script>
</body>
</html>
